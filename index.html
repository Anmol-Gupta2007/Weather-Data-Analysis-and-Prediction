<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Temperature Predictor</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="container">

    <h1>🌤 Weather Data Analysis & Prediction</h1>

    <p>Enter historical temperatures (comma separated)</p>

    <textarea id="temps"
        placeholder="25,26,27,28,29,30,31"></textarea>

    <button onclick="analyzeWeather()">
        Analyze & Predict
    </button>

    <div id="prediction"></div>

    <canvas id="weatherChart"></canvas>

</div>

<script src="script.js"></script>

</body>
</html>
